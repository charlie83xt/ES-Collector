      - SYMBOL=MES
      - EXCHANGE=${EXCHANGE}
      - DB_SYMBOL=MES_CONTFUT
      - SOURCE=ibkr
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}

  watchdog_mes:
