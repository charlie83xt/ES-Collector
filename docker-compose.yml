services:
  ib-gateway:
    image: gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - READ_ONLY_API=${READ_ONLY_API:-no}
      - TIME_ZONE=${TIME_ZONE:-Etc/UTC}
      # VNC only if you set password:
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD}
      # Optional 2FA behavior:
      - TWOFA_TIMEOUT_ACTION=${TWOFA_TIMEOUT_ACTION}
      - AUTO_RESTART_TIME=${AUTO_RESTART_TIME}
    volumes:
      - ibgw:/config
    ports:
      - "127.0.0.1:5900:5900"
    # no public ports

  collector_es:
    build: ./collector
    container_name: collector_es
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      - IB_HOST=ib-gateway
      - IB_PORT=4004
      - IB_CLIENT_ID=201
      - DATABASE_URL=${DATABASE_URL}
      - SYMBOL=ES
      - EXCHANGE=${EXCHANGE}
      - DB_SYMBOL=ES_CONTFUT
      - SOURCE=ibkr
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}

  watchdog_es:
    build: ./watchdog
    container_name: watchdog_es
    restart: unless-stopped
    depends_on:
      - ib-gateway
    environment:
      - IB_HOST=ib-gateway
      - IB_PORT=4004
      - IB_CLIENT_ID=202
      - DATABASE_URL=${DATABASE_URL}
      - SYMBOL=ES
      - EXCHANGE=${EXCHANGE}
      - DB_SYMBOL=ES_CONTFUT
      - SOURCE=ibkr
      - MAX_GAP_MINUTES=${MAX_GAP_MINUTES}
      - BACKFILL_MINUTES=${BACKFILL_MINUTES}
      - MAX_BACKFILL_DAYS=${MAX_BACKFILL_DAYS:-45}
      - WATCHDOG_INTERVAL_SECONDS=${WATCHDOG_INTERVAL_SECONDS}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}

  collector_mes:
